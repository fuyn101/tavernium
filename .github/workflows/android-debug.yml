name: Android debug APK

on:
  push:
    branches: [main]
    paths:
      - 'tavernium/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build debug APK and report signing certificate
        working-directory: tavernium
        run: ./gradlew --no-daemon :app:assembleDebug :app:signingReport
      - uses: actions/upload-artifact@v4
        with:
          name: tavernium-debug
          path: tavernium/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
